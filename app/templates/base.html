<!doctype html>
<html lang="en" data-accent="{{ site.accent or '#ff5e3a' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Studio{% endblock %} · {{ site.artist }}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff5e3a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
  <style>:root { --accent: {{ site.accent or '#ff5e3a' }}; }</style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('admin.dashboard') }}">
      <span class="dot"></span>{{ site.artist }} <span class="muted">studio</span>
    </a>
    <nav class="tabs">
      <a href="{{ url_for('admin.dashboard') }}">Gallery</a>
      <a href="{{ url_for('admin.new_artwork') }}">Add artwork</a>
      <a href="{{ url_for('admin.settings') }}">Settings</a>
      <a href="{{ url_for('admin.preview') }}" target="_blank" rel="noopener">Preview site ↗</a>
    </nav>
  </header>

  <main class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='admin.js') }}"></script>
</body>
</html>
